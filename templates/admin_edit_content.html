{% extends "base.html" %} {% block title %}Edit {{ content.section_key }} |
Admin{% endblock %} {% block content %}
<section class="py-12 bg-slate-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-[5%]">
    <div class="mb-6 flex justify-between items-center">
      <a
        href="{{ url_for('admin_dashboard') }}"
        class="text-slate-500 hover:text-primary font-semibold text-sm"
      >
        ← Back to Dashboard
      </a>
      <span
        class="text-xs font-bold uppercase tracking-wider text-accent bg-amber-50 px-3 py-1 rounded border border-amber-200"
      >
        Section: {{ content.section_key }}
      </span>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl font-bold text-slate-800 mb-6">
        Edit Section Content
      </h1>

      <form
        action="{{ url_for('edit_content', section_key=content.section_key) }}"
        method="POST"
        class="space-y-6"
      >
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >Main Heading / Title</label
          >
          <input
            type="text"
            name="title"
            value="{{ content.title or '' }}"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-primary text-slate-800"
            placeholder="Enter section title..."
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >Subtitle / Tagline</label
          >
          <input
            type="text"
            name="subtitle"
            value="{{ content.subtitle or '' }}"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-primary text-slate-800"
            placeholder="Enter section subtitle..."
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >Body Description</label
          >
          <textarea
            name="body_text"
            rows="6"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-primary text-slate-800 leading-relaxed"
            placeholder="Enter detailed description..."
          >
{{ content.body_text or '' }}</textarea
          >
        </div>

        <div class="flex gap-4 pt-2">
          <button
            type="submit"
            class="flex-1 bg-accent hover:bg-amber-600 text-white font-bold py-3.5 rounded-lg shadow-md transition-colors"
          >
            Save & Publish Live
          </button>
          <a
            href="{{ url_for('admin_dashboard') }}"
            class="px-6 py-3.5 rounded-lg border border-slate-300 text-slate-600 font-bold hover:bg-slate-100 text-center"
          >
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
